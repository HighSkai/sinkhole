name: Deploy demo

# Publishes the mock-data demo to GitHub Pages: https://highskai.github.io/sinkhole/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for /sinkhole/
        run: npm run build:pages
      - name: Drop server-only files
        # Pages compresses responses itself and ignores .br/.gz siblings; the manifest is build metadata.
        run: |
          find dist \( -name '*.br' -o -name '*.gz' \) -delete
          rm -rf dist/.vite
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

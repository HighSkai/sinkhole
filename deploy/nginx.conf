# Serve the static Sinkhole build with nginx.
# Copy dist/ to /usr/share/nginx/html and include this file in your http {} block.
# brotli_static needs the ngx_brotli module; remove that line if you don't have it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static   on;
    brotli_static on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Hashed assets never change: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Real backend on the same origin, including the WebSocket stream:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8053;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }

    # SPA shell: always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
